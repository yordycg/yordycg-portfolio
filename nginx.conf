server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;
  client_max_body_size 1m;

  gzip on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Compatibilidad local con el subpath de GitHub Pages que usa 404.html
  location /yordycg-portfolio/ {
    rewrite ^/yordycg-portfolio/(.*)$ /$1 last;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
